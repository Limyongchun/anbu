name: Preview
on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/mobile/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: 16.17.4
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish update
        run: eas update --branch preview --message "GitHub Action Auto Update" --non-interactive
        working-directory: artifacts/mobile
